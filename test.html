<!DOCTYPE html>
<html lang="ja">
<head><meta charset="utf-8"><title>embed test</title></head>
<body>
<div id="log"></div>
<div id="slots"></div>
<script>
var IDS = ["xNkE9GSnBA8","_55yrwCUIjQ","O5Ht4CMkYG4","X6x2HQWLilM","uVT9pQgM94k","c9pEKvZP9HU","zTfuEsZON4A","wkF_eeFyroM","AJhADz48D4U","E-RzTuzfmr8","l7ULux28tZ0"];
window.results = {};
IDS.forEach(function (id) { window.results[id] = "pending"; });

var tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

function onYouTubeIframeAPIReady() {
  IDS.forEach(function (id, i) {
    var d = document.createElement("div");
    d.id = "p" + i;
    document.getElementById("slots").appendChild(d);
    new YT.Player("p" + i, {
      width: 160, height: 90, videoId: id,
      playerVars: { autoplay: 1, mute: 1, playsinline: 1 },
      events: {
        onReady: function (e) { try { e.target.mute(); e.target.playVideo(); } catch (err) {} },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.PLAYING) {
            window.results[id] = "OK";
            try { e.target.stopVideo(); } catch (err) {}
          }
        },
        onError: function (e) { window.results[id] = "ERR" + e.data; }
      }
    });
  });
}
</script>
</body>
</html>
