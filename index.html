<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6FD0">
<title>うたのたな</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
  :root {
    --bg:      #E4E8EF;
    --surface: #FFFFFF;
    --ink:     #161A22;
    --muted:   #5C6476;
    --line:    #C6CDDA;
    --accent:  #2E6FD0;
    --shadow:  0 1px 2px rgba(22,26,34,.08), 0 6px 20px rgba(22,26,34,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:      #0F131B;
      --surface: #191F2A;
      --ink:     #E9EDF4;
      --muted:   #8D97AA;
      --line:    #2B3240;
      --accent:  #5B93E8;
      --shadow:  0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg:      #0F131B;
    --surface: #191F2A;
    --ink:     #E9EDF4;
    --muted:   #8D97AA;
    --line:    #2B3240;
    --accent:  #5B93E8;
    --shadow:  0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    max-width: 820px;
    margin: 0 auto;
    padding: 16px 14px calc(24px + env(safe-area-inset-bottom));
  }
  h1 {
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 900;
    font-size: 1.3rem;
    letter-spacing: .08em;
    margin: 4px 2px 14px;
  }
  h1 .note { color: var(--accent); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
  }
  .card {
    appearance: none;
    border: 0;
    padding: 0 0 10px;
    background: var(--surface);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow);
    cursor: pointer;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: transform .08s ease;
  }
  .card:active { transform: scale(.97); }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .thumb {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    display: block;
    background: var(--line);
  }
  .card .name {
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 700;
    font-size: .95rem;
    line-height: 1.4;
    padding: 0 12px;
  }
  /* ── player overlay ── */
  .player {
    position: fixed;
    inset: 0;
    background: rgba(10, 13, 20, .96);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 14px;
    z-index: 10;
  }
  .player.open { display: flex; }
  .player .frame {
    width: min(100%, 920px, calc((100dvh - 120px) * 16 / 9));
    aspect-ratio: 16 / 9;
    border: 0;
    border-radius: 12px;
    background: #000;
  }
  .player .close {
    appearance: none;
    border: 0;
    background: #fff;
    color: #161A22;
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 900;
    font-size: 1.05rem;
    letter-spacing: .1em;
    padding: 14px 44px;
    border-radius: 999px;
    cursor: pointer;
  }
  .foot {
    margin: 22px 2px 0;
    font-size: .74rem;
    color: var(--muted);
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="app">
  <h1><span class="note">♪</span> うたのたな</h1>
  <div class="grid" id="grid"></div>
  <p class="foot">みたいうたを タップしてね。おわったら「おしまい」。</p>
</div>

<div class="player" id="player">
  <iframe class="frame" id="frame" src="about:blank" allow="autoplay; encrypted-media; fullscreen" allowfullscreen title="うたの動画"></iframe>
  <button class="close" id="close">おしまい</button>
</div>

<script>
(function () {
  "use strict";

  // ここに動画を足す：{ id: "YouTubeのID", name: "表示名" }
  var SONGS = [
    { id: "nAjJluQCSGE", name: "ぼよよんこうしんきょく" },
    { id: "X6x2HQWLilM", name: "にじのむこうに" },
    { id: "uVT9pQgM94k", name: "ぴ〜ぴ〜ぱお！" },
    { id: "c9pEKvZP9HU", name: "どんないろがすき" },
    { id: "zTfuEsZON4A", name: "チューリップ" },
    { id: "wkF_eeFyroM", name: "こいのぼり" },
    { id: "AJhADz48D4U", name: "ちょうちょう" },
    { id: "E-RzTuzfmr8", name: "やぎさんゆうびん" },
    { id: "l7ULux28tZ0", name: "さんぽ" }
  ];

  var grid = document.getElementById("grid");
  var player = document.getElementById("player");
  var frame = document.getElementById("frame");

  SONGS.forEach(function (s) {
    var b = document.createElement("button");
    b.className = "card";
    var img = document.createElement("img");
    img.className = "thumb";
    img.loading = "lazy";
    img.alt = "";
    img.src = "https://i.ytimg.com/vi/" + s.id + "/hqdefault.jpg";
    var name = document.createElement("span");
    name.className = "name";
    name.textContent = s.name;
    b.appendChild(img);
    b.appendChild(name);
    b.addEventListener("click", function () { open(s.id); });
    grid.appendChild(b);
  });

  function open(id) {
    frame.src = "https://www.youtube-nocookie.com/embed/" + id +
      "?autoplay=1&rel=0&playsinline=1&iv_load_policy=3";
    player.classList.add("open");
  }
  function close() {
    player.classList.remove("open");
    frame.src = "about:blank";
  }
  document.getElementById("close").addEventListener("click", close);

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
})();
</script>
</body>
</html>
